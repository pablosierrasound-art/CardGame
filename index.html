<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardGame</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #151923; color: white; font-family: system-ui, sans-serif; }
    #game { min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
    #status { position: fixed; left: 12px; bottom: 12px; font-size: 12px; color: #cbd5e1; z-index: 10; }
    canvas { display: block; max-width: 100%; }
  </style>
</head>
<body>
  <div id="game"><div id="loading">Cargando CardGame...</div></div>
  <div id="status">Iniciando Phaser 3...</div>
  <script>
    window.addEventListener("error", e => { document.getElementById("status").textContent = "Error: " + e.message; });
    window.addEventListener("unhandledrejection", e => { document.getElementById("status").textContent = "Error: " + String(e.reason); });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
